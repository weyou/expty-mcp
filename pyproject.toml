[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "expty-mcp"
version = "0.1.0"
description = "High-performance Model Context Protocol (MCP) server for interactive PTY processes, SSH, and Serial streams with zero-loss continuous ingestion and atomic Expect state machine."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "weyou", email = "weyou.dev@gmail.com" }
]
keywords = [
    "mcp",
    "model-context-protocol",
    "terminal",
    "pty",
    "expect",
    "ssh",
    "serial",
    "interactive",
    "claude",
    "cursor",
    "antigravity"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
    "Topic :: Terminals",
    "Topic :: System :: Shells"
]
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "pyserial>=3.5",
    "ptyprocess>=0.7.0; platform_system != 'Windows'",
    "pywinpty>=2.0.0; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/weyou/expty-mcp"
Repository = "https://github.com/weyou/expty-mcp"
Issues = "https://github.com/weyou/expty-mcp/issues"

[project.scripts]
expty-mcp = "expty_mcp.__main__:main"
expty = "expty_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/expty_mcp"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
